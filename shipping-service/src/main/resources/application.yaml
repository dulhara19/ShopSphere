server:
  port: 3006

spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: shopsphere_shipping
  application:
    name: shipping-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
