openapi: 3.0.3
info:
  title: Review Service API
  description: |
    Review Service manages product reviews, ratings, and comments for ShopSphere.
  version: 1.0.0
  contact:
    name: Team Member 7
    email: team7@shopsphere.com

servers:
  - url: http://localhost:3007
    description: Local development
  - url: https://api.shopsphere.com
    description: Production

tags:
  - name: Reviews
    description: Product reviews
  - name: Ratings
    description: Rating aggregation
  - name: Comments
    description: Review comments
  - name: Moderation
    description: Review moderation
  - name: Internal
    description: Internal service-to-service APIs

paths:
  # ==================== REVIEWS ====================
  /api/reviews:
    post:
      tags:
        - Reviews
      summary: Create review
      description: Create a new product review
      operationId: createReview
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          description: Invalid input or already reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reviews/{reviewId}:
    get:
      tags:
        - Reviews
      summary: Get review
      description: Get review by ID
      operationId: getReview
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '404':
          description: Review not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Reviews
      summary: Update review
      description: Update own review
      operationId: updateReview
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'

    delete:
      tags:
        - Reviews
      summary: Delete review
      description: Delete own review
      operationId: deleteReview
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/reviews/product/{productId}:
    get:
      tags:
        - Reviews
      summary: Get product reviews
      description: Get reviews for a product
      operationId: getProductReviews
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, highest, lowest, helpful]
            default: newest
        - name: rating
          in: query
          description: Filter by rating (1-5)
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        '200':
          description: Reviews retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'

  /api/reviews/product/{productId}/summary:
    get:
      tags:
        - Ratings
      summary: Get rating summary
      description: Get rating summary for a product
      operationId: getRatingSummary
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Summary retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingSummaryResponse'

  /api/reviews/product/{productId}/featured:
    get:
      tags:
        - Reviews
      summary: Get featured reviews
      description: Get top helpful reviews for a product
      operationId: getFeaturedReviews
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 3
            maximum: 10
      responses:
        '200':
          description: Featured reviews retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponse'

  /api/reviews/user/me:
    get:
      tags:
        - Reviews
      summary: Get my reviews
      description: Get reviews written by current user
      operationId: getMyReviews
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Reviews retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'

  # ==================== HELPFULNESS ====================
  /api/reviews/{reviewId}/helpful:
    post:
      tags:
        - Reviews
      summary: Mark as helpful
      description: Mark a review as helpful
      operationId: markHelpful
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked as helpful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'

    delete:
      tags:
        - Reviews
      summary: Remove helpful mark
      description: Remove helpful mark from review
      operationId: removeHelpful
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Helpful mark removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'

  # ==================== COMMENTS ====================
  /api/reviews/{reviewId}/comments:
    get:
      tags:
        - Comments
      summary: Get review comments
      description: Get comments on a review
      operationId: getReviewComments
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comments retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'

    post:
      tags:
        - Comments
      summary: Add comment
      description: Add a comment to a review
      operationId: addComment
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'

  /api/comments/{commentId}:
    put:
      tags:
        - Comments
      summary: Update comment
      description: Update own comment
      operationId: updateComment
      security:
        - bearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'

    delete:
      tags:
        - Comments
      summary: Delete comment
      description: Delete own comment
      operationId: deleteComment
      security:
        - bearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comment deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/reviews/{reviewId}/seller-response:
    post:
      tags:
        - Comments
      summary: Add seller response
      description: Add official seller response to review
      operationId: addSellerResponse
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Seller response added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'

  # ==================== MODERATION ====================
  /api/reviews/{reviewId}/report:
    post:
      tags:
        - Moderation
      summary: Report review
      description: Report a review for moderation
      operationId: reportReview
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportReviewRequest'
      responses:
        '200':
          description: Review reported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/admin/reviews/queue:
    get:
      tags:
        - Moderation
      summary: Get moderation queue
      description: Get reviews pending moderation (Admin)
      operationId: getModerationQueue
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReviewStatus'
      responses:
        '200':
          description: Queue retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'

  /api/admin/reviews/{reviewId}/approve:
    put:
      tags:
        - Moderation
      summary: Approve review
      description: Approve a pending review (Admin)
      operationId: approveReview
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'

  /api/admin/reviews/{reviewId}/reject:
    put:
      tags:
        - Moderation
      summary: Reject review
      description: Reject a review (Admin)
      operationId: rejectReview
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectReviewRequest'
      responses:
        '200':
          description: Review rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'

  # ==================== INTERNAL ====================
  /internal/reviews/product/{productId}/rating:
    get:
      tags:
        - Internal
      summary: Get product rating
      description: Internal endpoint for product service
      operationId: getInternalRating
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rating retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalRatingResponse'

  /internal/reviews/ratings/batch:
    post:
      tags:
        - Internal
      summary: Batch get ratings
      description: Get ratings for multiple products
      operationId: getInternalRatingsBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRatingsRequest'
      responses:
        '200':
          description: Ratings retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRatingsResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ==================== REQUEST SCHEMAS ====================
    CreateReviewRequest:
      type: object
      required:
        - productId
        - rating
      properties:
        productId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 5000

    UpdateReviewRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 5000

    CreateCommentRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          maxLength: 1000
        parentId:
          type: string
          format: uuid
          description: Parent comment ID for replies

    UpdateCommentRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          maxLength: 1000

    ReportReviewRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          enum: [SPAM, INAPPROPRIATE, FAKE, OFF_TOPIC, OTHER]
        comments:
          type: string
          maxLength: 500

    RejectReviewRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 500

    BatchRatingsRequest:
      type: object
      required:
        - productIds
      properties:
        productIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100

    # ==================== RESPONSE SCHEMAS ====================
    ReviewResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userName:
          type: string
        rating:
          type: integer
        title:
          type: string
        body:
          type: string
        isVerifiedPurchase:
          type: boolean
        helpfulCount:
          type: integer
        markedHelpfulByUser:
          type: boolean
        status:
          $ref: '#/components/schemas/ReviewStatus'
        images:
          type: array
          items:
            type: string
            format: uri
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReviewListResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReviewResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    RatingSummaryResponse:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        averageRating:
          type: number
          format: double
        totalReviews:
          type: integer
        distribution:
          type: object
          properties:
            '5':
              type: integer
            '4':
              type: integer
            '3':
              type: integer
            '2':
              type: integer
            '1':
              type: integer

    CommentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reviewId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userName:
          type: string
        body:
          type: string
        isSellerResponse:
          type: boolean
        parentId:
          type: string
          format: uuid
        replies:
          type: array
          items:
            $ref: '#/components/schemas/CommentResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InternalRatingResponse:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        averageRating:
          type: number
          format: double
        reviewCount:
          type: integer

    BatchRatingsResponse:
      type: object
      properties:
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/InternalRatingResponse'

    MessageResponse:
      type: object
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string

    # ==================== ENUMS ====================
    ReviewStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
        - FLAGGED
