# =============================================================================
# SERVICE API CONTRACT TEMPLATE
# =============================================================================
# Instructions for Team Members:
# 1. Copy this file and rename to {your-service}-service.yaml
# 2. Replace all {placeholders} with actual values
# 3. Define all your API endpoints under 'paths'
# 4. Define all DTOs under 'components/schemas'
# 5. Get Team Lead approval before implementing
# =============================================================================

openapi: 3.0.3
info:
  title: "{Service Name} API"
  description: |
    ShopSphere {Service Name} - {Brief description of service responsibility}

    ## Authentication
    - Public endpoints require JWT Bearer token
    - Internal endpoints require X-Service-Name and X-Service-Secret headers
    - Admin endpoints require JWT with ADMIN role

  version: 1.0.0
  contact:
    name: "{Owner Name}"

servers:
  - url: http://localhost:{port}
    description: Local development
  - url: https://api.shopsphere.com/{service}
    description: Production

tags:
  - name: public
    description: Public APIs (requires user auth)
  - name: internal
    description: Internal APIs (service-to-service only)
  - name: admin
    description: Admin APIs (requires admin role)

paths:
  # =============================================================================
  # PUBLIC ENDPOINTS
  # =============================================================================
  /api/{resource}:
    get:
      tags: [public]
      summary: "List {resources}"
      description: "Returns paginated list of {resources}"
      operationId: "list{Resources}"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_{Resource}List'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [public]
      summary: "Create {resource}"
      operationId: "create{Resource}"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create{Resource}Request'
      responses:
        '201':
          description: "{Resource} created"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_{Resource}'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/{resource}/{id}:
    get:
      tags: [public]
      summary: "Get {resource} by ID"
      operationId: "get{Resource}"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_{Resource}'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # =============================================================================
  # INTERNAL ENDPOINTS (Service-to-Service)
  # =============================================================================
  /internal/{resource}/{id}:
    get:
      tags: [internal]
      summary: "Internal: Get {resource}"
      operationId: "internalGet{Resource}"
      security:
        - serviceAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_{Resource}'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from User Service
    serviceAuth:
      type: apiKey
      in: header
      name: X-Service-Secret
      description: Service-to-service authentication

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # =============================================================================
    # STANDARD RESPONSE WRAPPERS (DO NOT MODIFY)
    # =============================================================================
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              type: string
            timestamp:
              type: string
              format: date-time
            path:
              type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    # =============================================================================
    # YOUR SERVICE SCHEMAS (DEFINE BELOW)
    # =============================================================================
    # {Resource}:
    #   type: object
    #   properties:
    #     id:
    #       type: string
    #       format: uuid
    #     # Add your properties here
    #
    # Create{Resource}Request:
    #   type: object
    #   required:
    #     - # required fields
    #   properties:
    #     # Add your properties here
    #
    # ApiResponse_{Resource}:
    #   type: object
    #   properties:
    #     success:
    #       type: boolean
    #     data:
    #       $ref: '#/components/schemas/{Resource}'
    #
    # ApiResponse_{Resource}List:
    #   type: object
    #   properties:
    #     success:
    #       type: boolean
    #     data:
    #       type: array
    #       items:
    #         $ref: '#/components/schemas/{Resource}'
    #     meta:
    #       $ref: '#/components/schemas/PaginationMeta'
