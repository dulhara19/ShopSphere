openapi: 3.0.3
info:
  title: Analytics Service API
  description: |
    Analytics Service provides sales analytics, reports, and dashboards for ShopSphere.
  version: 1.0.0
  contact:
    name: Team Member 10
    email: team10@shopsphere.com

servers:
  - url: http://localhost:3010
    description: Local development
  - url: https://api.shopsphere.com
    description: Production

tags:
  - name: Dashboard
    description: Dashboard metrics
  - name: Sales
    description: Sales analytics
  - name: Products
    description: Product analytics
  - name: Customers
    description: Customer analytics
  - name: Reports
    description: Report generation
  - name: Internal
    description: Internal service-to-service APIs

paths:
  # ==================== DASHBOARD ====================
  /api/analytics/dashboard:
    get:
      tags:
        - Dashboard
      summary: Get dashboard overview
      description: Get main dashboard metrics
      operationId: getDashboard
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/TimePeriod'
      responses:
        '200':
          description: Dashboard data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'

  /api/analytics/dashboard/real-time:
    get:
      tags:
        - Dashboard
      summary: Get real-time metrics
      description: Get live metrics for dashboard
      operationId: getRealTimeMetrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Real-time metrics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealTimeMetrics'

  /api/analytics/dashboard/kpis:
    get:
      tags:
        - Dashboard
      summary: Get KPIs
      description: Get key performance indicators
      operationId: getKPIs
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/TimePeriod'
      responses:
        '200':
          description: KPIs retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPIResponse'

  # ==================== SALES ANALYTICS ====================
  /api/analytics/sales:
    get:
      tags:
        - Sales
      summary: Get sales analytics
      description: Get detailed sales analytics
      operationId: getSalesAnalytics
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: granularity
          in: query
          schema:
            type: string
            enum: [HOUR, DAY, WEEK, MONTH]
            default: DAY
      responses:
        '200':
          description: Sales analytics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesAnalyticsResponse'

  /api/analytics/sales/summary:
    get:
      tags:
        - Sales
      summary: Get sales summary
      description: Get sales summary for a period
      operationId: getSalesSummary
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/TimePeriod'
      responses:
        '200':
          description: Sales summary retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummary'

  /api/analytics/sales/by-category:
    get:
      tags:
        - Sales
      summary: Get sales by category
      description: Get sales breakdown by category
      operationId: getSalesByCategory
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Category sales retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySalesResponse'

  /api/analytics/sales/by-region:
    get:
      tags:
        - Sales
      summary: Get sales by region
      description: Get sales breakdown by geographic region
      operationId: getSalesByRegion
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Regional sales retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionalSalesResponse'

  /api/analytics/sales/trends:
    get:
      tags:
        - Sales
      summary: Get sales trends
      description: Get sales trend analysis
      operationId: getSalesTrends
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/TimePeriod'
      responses:
        '200':
          description: Trends retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendAnalysis'

  # ==================== PRODUCT ANALYTICS ====================
  /api/analytics/products/top-selling:
    get:
      tags:
        - Products
      summary: Get top selling products
      description: Get best selling products
      operationId: getTopSellingProducts
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/TimePeriod'
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Top products retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAnalyticsResponse'

  /api/analytics/products/low-performing:
    get:
      tags:
        - Products
      summary: Get low performing products
      description: Get products with low sales
      operationId: getLowPerformingProducts
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/TimePeriod'
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Low performing products retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAnalyticsResponse'

  /api/analytics/products/{productId}:
    get:
      tags:
        - Products
      summary: Get product analytics
      description: Get analytics for a specific product
      operationId: getProductAnalytics
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/TimePeriod'
      responses:
        '200':
          description: Product analytics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleProductAnalytics'

  /api/analytics/products/inventory-turnover:
    get:
      tags:
        - Products
      summary: Get inventory turnover
      description: Get inventory turnover rates
      operationId: getInventoryTurnover
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/TimePeriod'
      responses:
        '200':
          description: Inventory turnover retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryTurnoverResponse'

  # ==================== CUSTOMER ANALYTICS ====================
  /api/analytics/customers/overview:
    get:
      tags:
        - Customers
      summary: Get customer overview
      description: Get customer analytics overview
      operationId: getCustomerOverview
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/TimePeriod'
      responses:
        '200':
          description: Customer overview retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOverview'

  /api/analytics/customers/acquisition:
    get:
      tags:
        - Customers
      summary: Get customer acquisition
      description: Get new customer acquisition metrics
      operationId: getCustomerAcquisition
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: granularity
          in: query
          schema:
            type: string
            enum: [DAY, WEEK, MONTH]
            default: DAY
      responses:
        '200':
          description: Acquisition data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAcquisitionResponse'

  /api/analytics/customers/retention:
    get:
      tags:
        - Customers
      summary: Get customer retention
      description: Get customer retention metrics
      operationId: getCustomerRetention
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/TimePeriod'
      responses:
        '200':
          description: Retention data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRetentionResponse'

  /api/analytics/customers/lifetime-value:
    get:
      tags:
        - Customers
      summary: Get customer lifetime value
      description: Get CLV metrics
      operationId: getCustomerLifetimeValue
      security:
        - bearerAuth: []
      responses:
        '200':
          description: CLV data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerLifetimeValueResponse'

  /api/analytics/customers/segments:
    get:
      tags:
        - Customers
      summary: Get customer segments
      description: Get customer segment breakdown
      operationId: getCustomerSegments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Segments retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSegmentsResponse'

  # ==================== REPORTS ====================
  /api/analytics/reports:
    get:
      tags:
        - Reports
      summary: List reports
      description: Get available reports
      operationId: listReports
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ReportType'
      responses:
        '200':
          description: Reports listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportMetadata'

    post:
      tags:
        - Reports
      summary: Generate report
      description: Generate a new report
      operationId: generateReport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateReportRequest'
      responses:
        '202':
          description: Report generation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportMetadata'

  /api/analytics/reports/{id}:
    get:
      tags:
        - Reports
      summary: Get report
      description: Get report details and status
      operationId: getReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportMetadata'

    delete:
      tags:
        - Reports
      summary: Delete report
      description: Delete a generated report
      operationId: deleteReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/analytics/reports/{id}/download:
    get:
      tags:
        - Reports
      summary: Download report
      description: Download generated report file
      operationId: downloadReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          schema:
            type: string
            enum: [PDF, CSV, XLSX]
            default: PDF
      responses:
        '200':
          description: Report file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/analytics/reports/schedule:
    get:
      tags:
        - Reports
      summary: List scheduled reports
      description: Get scheduled report configurations
      operationId: listScheduledReports
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scheduled reports listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledReport'

    post:
      tags:
        - Reports
      summary: Schedule report
      description: Schedule a recurring report
      operationId: scheduleReport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleReportRequest'
      responses:
        '201':
          description: Report scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledReport'

  /api/analytics/reports/schedule/{id}:
    delete:
      tags:
        - Reports
      summary: Cancel scheduled report
      description: Cancel a scheduled report
      operationId: cancelScheduledReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Schedule cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # ==================== INTERNAL ====================
  /internal/analytics/record-event:
    post:
      tags:
        - Internal
      summary: Record analytics event
      description: Internal endpoint to record analytics events
      operationId: recordEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEvent'
      responses:
        '200':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /internal/analytics/record-batch:
    post:
      tags:
        - Internal
      summary: Record batch events
      description: Internal endpoint to record batch analytics events
      operationId: recordBatchEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/AnalyticsEvent'
                  maxItems: 1000
      responses:
        '200':
          description: Events recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded:
                    type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ==================== REQUEST SCHEMAS ====================
    GenerateReportRequest:
      type: object
      required:
        - type
        - from
        - to
      properties:
        type:
          $ref: '#/components/schemas/ReportType'
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        filters:
          type: object
          additionalProperties: true
        format:
          type: string
          enum: [PDF, CSV, XLSX]
          default: PDF

    ScheduleReportRequest:
      type: object
      required:
        - type
        - frequency
        - recipients
      properties:
        type:
          $ref: '#/components/schemas/ReportType'
        frequency:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
        recipients:
          type: array
          items:
            type: string
            format: email
        format:
          type: string
          enum: [PDF, CSV, XLSX]
          default: PDF

    AnalyticsEvent:
      type: object
      required:
        - eventType
        - timestamp
      properties:
        eventType:
          type: string
          enum:
            - ORDER_PLACED
            - ORDER_COMPLETED
            - ORDER_CANCELLED
            - PAYMENT_PROCESSED
            - REFUND_ISSUED
            - PRODUCT_VIEWED
            - PRODUCT_ADDED_TO_CART
            - USER_REGISTERED
            - USER_LOGIN
        timestamp:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        metadata:
          type: object
          additionalProperties: true

    # ==================== RESPONSE SCHEMAS ====================
    DashboardResponse:
      type: object
      properties:
        revenue:
          $ref: '#/components/schemas/MetricWithChange'
        orders:
          $ref: '#/components/schemas/MetricWithChange'
        customers:
          $ref: '#/components/schemas/MetricWithChange'
        averageOrderValue:
          $ref: '#/components/schemas/MetricWithChange'
        conversionRate:
          $ref: '#/components/schemas/MetricWithChange'
        revenueChart:
          type: array
          items:
            $ref: '#/components/schemas/ChartDataPoint'
        topProducts:
          type: array
          items:
            $ref: '#/components/schemas/ProductMetric'
        recentOrders:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'

    RealTimeMetrics:
      type: object
      properties:
        activeUsers:
          type: integer
        ordersToday:
          type: integer
        revenueToday:
          type: number
          format: double
        cartAbandonment:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time

    KPIResponse:
      type: object
      properties:
        grossRevenue:
          $ref: '#/components/schemas/MetricWithChange'
        netRevenue:
          $ref: '#/components/schemas/MetricWithChange'
        totalOrders:
          $ref: '#/components/schemas/MetricWithChange'
        averageOrderValue:
          $ref: '#/components/schemas/MetricWithChange'
        customerAcquisitionCost:
          $ref: '#/components/schemas/MetricWithChange'
        customerLifetimeValue:
          $ref: '#/components/schemas/MetricWithChange'
        conversionRate:
          $ref: '#/components/schemas/MetricWithChange'
        returnRate:
          $ref: '#/components/schemas/MetricWithChange'

    MetricWithChange:
      type: object
      properties:
        value:
          type: number
          format: double
        previousValue:
          type: number
          format: double
        change:
          type: number
          format: double
          description: Percentage change
        trend:
          type: string
          enum: [UP, DOWN, STABLE]

    SalesAnalyticsResponse:
      type: object
      properties:
        totalRevenue:
          type: number
          format: double
        totalOrders:
          type: integer
        averageOrderValue:
          type: number
          format: double
        data:
          type: array
          items:
            $ref: '#/components/schemas/SalesDataPoint'

    SalesDataPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        revenue:
          type: number
          format: double
        orders:
          type: integer
        averageOrderValue:
          type: number
          format: double

    SalesSummary:
      type: object
      properties:
        totalRevenue:
          type: number
          format: double
        totalOrders:
          type: integer
        totalUnits:
          type: integer
        averageOrderValue:
          type: number
          format: double
        refunds:
          type: number
          format: double
        netRevenue:
          type: number
          format: double

    CategorySalesResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            type: object
            properties:
              categoryId:
                type: string
                format: uuid
              categoryName:
                type: string
              revenue:
                type: number
                format: double
              orders:
                type: integer
              percentage:
                type: number
                format: double

    RegionalSalesResponse:
      type: object
      properties:
        regions:
          type: array
          items:
            type: object
            properties:
              country:
                type: string
              region:
                type: string
              revenue:
                type: number
                format: double
              orders:
                type: integer

    TrendAnalysis:
      type: object
      properties:
        salesTrend:
          type: string
          enum: [INCREASING, DECREASING, STABLE]
        growthRate:
          type: number
          format: double
        seasonality:
          type: string
        forecast:
          type: array
          items:
            $ref: '#/components/schemas/ChartDataPoint'

    ProductAnalyticsResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductMetric'

    ProductMetric:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        imageUrl:
          type: string
          format: uri
        revenue:
          type: number
          format: double
        unitsSold:
          type: integer
        averagePrice:
          type: number
          format: double

    SingleProductAnalytics:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        totalRevenue:
          type: number
          format: double
        totalUnitsSold:
          type: integer
        averageRating:
          type: number
          format: double
        viewToSaleRate:
          type: number
          format: double
        salesHistory:
          type: array
          items:
            $ref: '#/components/schemas/ChartDataPoint'

    InventoryTurnoverResponse:
      type: object
      properties:
        averageTurnover:
          type: number
          format: double
        products:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
              productName:
                type: string
              turnoverRate:
                type: number
                format: double
              daysToSell:
                type: integer

    CustomerOverview:
      type: object
      properties:
        totalCustomers:
          type: integer
        newCustomers:
          type: integer
        returningCustomers:
          type: integer
        averageOrdersPerCustomer:
          type: number
          format: double
        averageSpendPerCustomer:
          type: number
          format: double

    CustomerAcquisitionResponse:
      type: object
      properties:
        totalNewCustomers:
          type: integer
        acquisitionCost:
          type: number
          format: double
        data:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              newCustomers:
                type: integer
              source:
                type: string

    CustomerRetentionResponse:
      type: object
      properties:
        retentionRate:
          type: number
          format: double
        churnRate:
          type: number
          format: double
        cohortAnalysis:
          type: array
          items:
            type: object
            properties:
              cohort:
                type: string
              month1:
                type: number
              month2:
                type: number
              month3:
                type: number
              month6:
                type: number

    CustomerLifetimeValueResponse:
      type: object
      properties:
        averageCLV:
          type: number
          format: double
        clvBySegment:
          type: array
          items:
            type: object
            properties:
              segment:
                type: string
              clv:
                type: number
                format: double
              customerCount:
                type: integer

    CustomerSegmentsResponse:
      type: object
      properties:
        segments:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              customerCount:
                type: integer
              percentage:
                type: number
                format: double
              averageSpend:
                type: number
                format: double
              characteristics:
                type: array
                items:
                  type: string

    ReportMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ReportType'
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
