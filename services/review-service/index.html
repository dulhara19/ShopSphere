<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShopSphere Review Test UI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f0f2f5; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; }

        /* Star Rating Styles */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
        }
        .star-rating input { display: none; }
        .star-rating label {
            font-size: 35px;
            color: #ccc;
            cursor: pointer;
            transition: 0.2s;
        }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #ffca08;
        }

        input[type="text"], textarea {
            width: 100%; padding: 10px; margin-top: 5px;
            border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;
        }

        button {
            width: 100%; padding: 12px; background-color: #1a73e8; color: white;
            border: none; border-radius: 6px; margin-top: 20px; cursor: pointer;
            font-size: 16px; transition: 0.3s;
        }
        button:hover { background-color: #1557b0; }

        #response { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Review Service Tester</h2>

    <label>Product ID</label>
    <input type="text" id="productId" placeholder="e.g. P1001" value="P1001">

    <label>Rating</label>
    <div class="star-rating">
        <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
        <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
        <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
        <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
        <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
    </div>

    <label>Review Title</label>
    <input type="text" id="title" placeholder="Summary of your experience">

    <label>Comment</label>
    <textarea id="body" rows="4" placeholder="Write your thoughts here..."></textarea>

    <button onclick="sendReview()">Submit Review</button>

    <div id="response"></div>
</div>

<script>
    async function sendReview() {
        const responseDiv = document.getElementById('response');


        const selectedRating = document.querySelector('input[name="rating"]:checked');
        const ratingValue = selectedRating ? parseInt(selectedRating.value) : 0;

        if (ratingValue === 0) {
            alert("Please select a rating star!");
            return;
        }

        const data = {
            productId: document.getElementById('productId').value,
            userId: "USER_001",
            rating: ratingValue,
            title: document.getElementById('title').value,
            body: document.getElementById('body').value,
            isVerifiedPurchase: true
        };

        try {
            const response = await fetch('http://localhost:3007/api/reviews', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();
                responseDiv.innerText = "✅ Success! Review ID: " + (result.id || "Saved");
                responseDiv.className = "success";
                responseDiv.style.display = "block";


                document.getElementById('title').value = "";
                document.getElementById('body').value = "";
                if (selectedRating) selectedRating.checked = false;
            } else {
                responseDiv.innerText = "❌ Error! Something went wrong.";
                responseDiv.className = "error";
                responseDiv.style.display = "block";
            }
        } catch (err) {
            responseDiv.innerText = "❌ Connection Failed! Make sure Spring Boot is running.";
            responseDiv.className = "error";
            responseDiv.style.display = "block";
        }
    }
</script>

</body>
</html>
