spring:
  application:
    name: analytics-service
  profiles:
    active: dev-h2
  
  datasource:
    url: jdbc:postgresql://localhost:5432/analytics_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
    show-sql: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

  redis:
    host: localhost
    port: 6379
    password: 
    timeout: 60000
    database: 0

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true

server:
  port: 3010
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.shopsphere: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

app:
  jwt:
    secret: your-secret-key-change-in-production
    expiration: 86400000
  security:
    enabled: true
