spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
    initialization-mode: never

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  # Disable RabbitMQ
  rabbitmq:
    enabled: false
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: false
  
  # Disable Redis
  redis:
    enabled: false
    host: localhost
    port: 6379
    timeout: 0
    database: 0
    lettuce:
      shutdown-timeout: 0ms
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

server:
  port: 3010

logging:
  level:
    root: INFO
    com.shopsphere: DEBUG
    org.springframework.web: DEBUG
