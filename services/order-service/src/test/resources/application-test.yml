spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672

server:
  port: 0

jwt:
  secret: test-secret-key-for-integration-tests-must-be-at-least-256-bits
  expiration: 86400000

order:
  cart:
    max-items: 50
    max-quantity-per-item: 10
    session-ttl-hours: 72
