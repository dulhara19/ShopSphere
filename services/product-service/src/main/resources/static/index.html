<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere Product Tester</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; line-height: 1.6; }
        .container { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; background: #f9f9f9; }
        input, textarea { width: 100%; padding: 8px; margin: 5px 0 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #218838; }
        .get-btn { background: #007bff; }
        .get-btn:hover { background: #0069d9; }
        #response { background: #333; color: #fff; padding: 15px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>🛍️ ShopSphere Product Service Tester</h2>

    <div class="container">
        <h3>1. Create New Product (POST)</h3>
        <label>Product Name:</label>
        <input type="text" id="name" placeholder="Ex: iPhone 15 Pro">
        
        <label>Price:</label>
        <input type="number" id="price" placeholder="Ex: 999.99">
        
        <label>Description:</label>
        <textarea id="description" rows="3" placeholder="Product details..."></textarea>
        
        <label>Category ID:</label>
        <input type="text" id="categoryId" placeholder="Ex: electronics-01">
        
        <button onclick="createProduct()">Add Product</button>
    </div>

    <div class="container">
        <h3>2. Get Product by ID (GET)</h3>
        <label>Enter Product ID:</label>
        <input type="text" id="searchId" placeholder="Paste the ID here">
        <button class="get-btn" onclick="getProduct()">Find Product</button>
    </div>

    <h3>🔍 API Response:</h3>
    <div id="response">මෙහි ප්‍රතිඵලය දිස්වනු ඇත...</div>

    <script>
        const API_BASE = "http://localhost:3002/api/products";

        // 1.1.1: Create Product Function
        async function createProduct() {
            const data = {
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('price').value),
                description: document.getElementById('description').value,
                categoryId: document.getElementById('categoryId').value,
                sellerId: "seller-test-01" // දැනට dummy එකක්
            };

            try {
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                document.getElementById('response').innerText = JSON.stringify(result, null, 2);
                
                // සාර්ථක නම් ID එක search box එකට දාමු ලේසි වෙන්න
                if(result.id) document.getElementById('searchId').value = result.id;
            } catch (err) {
                document.getElementById('response').innerText = "Error: " + err.message;
            }
        }

        // 1.1.2: Get Product Function
        async function getProduct() {
            const id = document.getElementById('searchId').value;
            if(!id) { alert("කරුණාකර ID එකක් ඇතුළත් කරන්න"); return; }

            try {
                const response = await fetch(`${API_BASE}/${id}`);
                if(response.status === 404) {
                    document.getElementById('response').innerText = "❌ 404: Product Not Found! (ඔයාගේ custom exception එක වැඩ!)";
                    return;
                }
                const result = await response.json();
                document.getElementById('response').innerText = JSON.stringify(result, null, 2);
            } catch (err) {
                document.getElementById('response').innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
