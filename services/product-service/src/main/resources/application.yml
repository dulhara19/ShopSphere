server:
  port: 3002

spring:
  application:
    name: product-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/productdb}
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
  
  # Story 1.4.1: Configure file upload limits
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 50MB

# Custom configuration for image storage
file:
  upload-dir: uploads/products