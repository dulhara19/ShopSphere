spring:
  application:
    name: user-service
  profiles:
    active: dev

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/shopsphere_user_dev
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000
      password:
      jedis:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  # Security Configuration
  security:
    filter:
      order: 5

server:
  port: 3001
  servlet:
    context-path: /api
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:shopsphere-dev-secret-key-minimum-32-characters-long-2026}
  expiration: 900000 # 15 minutes in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

# Logging Configuration
logging:
  level:
    root: INFO
    com.shopsphere: DEBUG
    org.springframework.security: DEBUG
    org.springframework.boot.actuate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/user-service.log
    max-size: 10MB
    max-history: 30

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

