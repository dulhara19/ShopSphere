spring:
  application:
    name: user-service
  profiles:
    active: dev

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

  # PostgreSQL Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopsphere_user_dev}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 0
      timeout: 2000
      password:
      jedis:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  # RabbitMQ Configuration (Phase 4.3: Event Publishing)
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    requested-heartbeat: 30s
    template:
      retry:
        enabled: true
        max-attempts: 3
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3s
          max-attempts: 3

  # Security & OAuth2 Configuration (Phase 5.1)
  security:
    filter:
      order: 5
    oauth2:
      client:
        registration:
          google:
            client-id: 456028357968-bvd8hlkghi79veltgr5lns84bfk33g5c.apps.googleusercontent.com
            client-secret: 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
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
        provider:
          google:
            user-name-attribute: email

server:
  port: 3001
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:shopsphere-dev-secret-key-minimum-32-characters-long-2026}
  expiration: 900000 # 15 minutes
  refresh-expiration: 604800000 # 7 days

# Logging Configuration
logging:
  level:
    root: INFO
    com.shopsphere: DEBUG
    org.springframework.security: DEBUG
    org.springframework.boot.actuate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/user-service.log
    max-size: 10MB
    max-history: 30

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
