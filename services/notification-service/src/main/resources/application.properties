server.port=3009
spring.application.name=notification-service

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/shopsphere_notification_db}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# SendGrid
sendgrid.api-key=${SENDGRID_API_KEY:default-key}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:noreply@shopsphere.com}
sendgrid.from-name=${SENDGRID_FROM_NAME:ShopSphere}
sendgrid.enabled=${SENDGRID_ENABLED:false}

# Logging
logging.level.com.shopsphere.notification=INFO