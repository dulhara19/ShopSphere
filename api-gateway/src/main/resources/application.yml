server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: shipping-service
          uri: lb://shipping-service
          predicates:
            - Path=/api/shipping/**
      globalcors:
        add-to-slash-path: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173" # React දුවන port එක
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka