version: '3.8'
services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    container_name: shopsphere-mongo

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"
    container_name: shopsphere-elastic

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    container_name: shopsphere-redis